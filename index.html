  <head>
    <meta charset="UTF-8" />

    <style>
      /* =========================================================
           HOME — padronização visual do sistema
           O styleindex.css continua carregado para preservar
           o fundo/efeitos existentes.
           ========================================================= */

      body.home-page {
        min-height: 100vh;
        margin: 0;
        padding: 20px 28px;
        background: #050505;
      }

      .home-page .gc-wrap {
        width: 100%;
        flex: 1;
        min-height: 0;
        margin: 0 auto;
        box-sizing: border-box;
        padding: 0 0 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        z-index: 1;
      }
      /* Hero */
      .home-page .gc-hero {
        width: min(100%, 650px);
        flex: 1;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .home-page .gc-welcome {
        margin: 0 0 9px;
        color: #f47b20;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .home-page .gc-title {
        margin: 0;
        color: #fff;
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: -0.8px;
      }

      .home-page .gc-title span {
        color: #b477ff;
      }

      /* Cards */
      .home-page .gc-cards {
        width: min(100%, 650px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .home-page .gc-card {
        padding: 14px;
        background: rgba(13, 13, 13, 0.94);
        border: 1px solid #292929;
        border-radius: 0;
        box-sizing: border-box;
        transition:
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      .home-page .gc-card:hover {
        border-color: #444;
        transform: translateY(-2px);
      }

      .home-page .gc-card-label {
        margin: 2px 0 12px;
        color: #777;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .home-page .gc-card-img {
        height: 112px;
        display: grid;
        place-items: center;
        border: 1px solid #292929;
        border-radius: 0;
        margin-bottom: 9px;
        background: #161616;
      }

      .home-page .gc-card-img.teams {
        background: rgba(124, 58, 237, 0.1);
      }

      .home-page .gc-card-img.maps {
        background: rgba(16, 185, 129, 0.07);
      }

      .home-page .sword-icon,
      .home-page .map-icon {
        width: 58px;
        height: 58px;
      }

      .home-page .gc-btn {
        width: 100%;
        min-height: 42px;
        border: 0;
        border-radius: 0;
        cursor: pointer;
        color: #fff;
        font: inherit;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          filter 0.18s ease,
          transform 0.18s ease;
      }

      .home-page .gc-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .home-page .gc-btn.teams {
        background: #f47b20;
      }

      .home-page .gc-btn.maps {
        background: #303030;
        border: 1px solid #4a4a4a;
      }

      /* Discord / rodapé */
      .home-page .gc-divider {
        width: min(100%, 650px);
        height: 1px;
        margin: 30px auto 20px;
        background: #252525;
      }

      .home-page .gc-discord-area {
        width: 100%;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .home-page .gc-discord-text {
        margin: 0 0 12px;
        color: #8a8a8a;
        font-size: 12px;
      }

      .home-page .gc-discord-btn {
        min-height: 40px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid #363636;
        border-radius: 0;
        background: #171717;
        color: #ddd;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 800;
        transition:
          border-color 0.18s ease,
          background 0.18s ease;
      }

      .home-page .gc-discord-btn:hover {
        border-color: #f47b20;
        background: #1d1d1d;
      }

      .home-page .gc-discord-btn svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }

      @media (max-width: 720px) {
        body.home-page {
          padding: 14px;
        }

        .home-page .gc-wrap {
          padding: 0 0 24px;
        }

        .home-page .gc-cards {
          grid-template-columns: 1fr;
          max-width: 380px;
        }
      }

      @media (max-width: 480px) {
        .home-page .gc-title {
          font-size: 29px;
        }

        .home-page .gc-card-img {
          height: 95px;
        }
      }
    </style>
  </head>
