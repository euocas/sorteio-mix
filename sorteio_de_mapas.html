<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorteio de Mapas</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="maps-page">
    <div class="sorteio-wrap">
      <!-- MODAL -->
      <div class="overlay" id="overlay"></div>

      <div class="result-panel" id="result-panel">
        <div class="result-title">Mapa Sorteado</div>
        <div class="result-maps" id="result-maps"></div>
      </div>

      <!-- CABEÇALHO -->
      <header class="sorteio-title site-header">
        <!-- MENU -->
        <nav class="tabs">
          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'index.html'"
          >
            Home
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'sorteio.php'"
          >
            Sorteio
          </button>

          <button
            type="button"
            class="btn btn-ghost active"
            onclick="window.location.href = 'sorteio_de_mapas.html'"
          >
            Mapa
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'ao_vivo.php'"
          >
            Ao Vivo
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'ranking.php'"
          >
            Ranking
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'historico.php'"
          >
            Histórico
          </button>
          <button
            type="button"
            class="btn btn-ghost"
            onclick="window.location.href = 'temporadas.php'"
          >
            Temporadas
          </button>
        </nav>

        <h1>⚡ SORTEIO DE MAPAS ⚡</h1>

        <p class="sorteio-subtitle">
          Selecione os mapas disponíveis para sortear o próximo
        </p>
      </header>

      <!-- CONTROLE -->
      <div class="sorteio-header">
        <div class="selected-count">
          Mapas selecionados<br />
          <strong id="count">0</strong>
          <span> / 11</span>
        </div>

        <div class="header-btns">
          <button type="button" class="btn btn-ghost" onclick="clearAll()">
            Limpar
          </button>

          <button
            type="button"
            class="btn btn-primary"
            id="btn-sort"
            onclick="sortear()"
            disabled
          >
            SORTEAR MAPA
          </button>
        </div>
      </div>

      <!-- MAPAS -->
      <div class="maps-grid" id="maps-grid"></div>
    </div>

    <!-- RODAPÉ -->
    <div class="copy">
      <footer>
        <p>
          Desenvolvido por
          <a
            href="https://github.com/euocas"
            target="_blank"
            rel="noopener noreferrer"
          >
            👾 PIXELCOPATA
          </a>
        </p>
      </footer>
    </div>

    <script>
      const maps = [
        {
          name: "Mirage",
          img: "https://static.wikia.nocookie.net/cswikia/images/f/f5/De_mirage_cs2.png/revision/latest?cb=20230807124319",
        },
        {
          name: "Inferno",
          img: "https://tradeit.gg/blog/wp-content/uploads/2023/07/image-22.webp",
        },
        {
          name: "Dust II",
          img: "https://tradeit.gg/blog/wp-content/uploads/2023/07/image-24-1024x576.webp",
        },
        {
          name: "Nuke",
          img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGiYY0W16voIa1r_8EbkbkvQRjgKUEOMIwkg&s",
        },
        {
          name: "Overpass",
          img: "https://preview.redd.it/here-are-some-more-cs2-maps-to-look-at-v0-5k76lkapek5b1.jpg?width=640&crop=smart&auto=webp&s=c3e4930a6d05ca8044cfe8e2b2f106a9898788cd",
        },
        {
          name: "Vertigo",
          img: "https://cs.money/blog/wp-content/uploads/sites/2/2023/07/vertigo.jpg",
        },
        {
          name: "Ancient",
          img: "https://assets.gamearena.gg/wp-content/uploads/2023/11/21084503/ancient-cs2.jpg",
        },
        {
          name: "Anubis",
          img: "https://img-cdn.hltv.org/gallerypicture/t1kgEuQxHuERdwsQUSnn_J.jpg?ixlib=java-2.1.0&w=1200&s=500213104f8aed24a009bac86526082f",
        },
        {
          name: "Train",
          img: "https://img-cdn.hltv.org/gallerypicture/NgeD50QLwAelmAEmVuigPs.png?ixlib=java-2.1.0&w=1200&s=c1b9181b40d92c22def72be504190055",
        },
        {
          name: "Cache",
          img: "https://images.steamusercontent.com/ugc/2397691894753915701/B2E571360CB344CFBD8E1039D889461080557BD9/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true",
        },
        {
          name: "Cobblestone",
          img: "https://images.steamusercontent.com/ugc/2396566628393664695/2E0B91D604EBB75D137A12DB87ED38336171C03A/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true",
        },
      ];

      const selected = new Set();

      function render() {
        const grid = document.getElementById("maps-grid");

        grid.innerHTML = maps
          .map(
            (m, i) => `
          <div
            class="map-card ${selected.has(i) ? "selected" : ""}"
            onclick="toggle(${i})"
          >

            ${
              m.img
                ? `
                  <img
                    class="map-img"
                    src="${m.img}"
                    alt="${m.name}"
                    onerror="this.style.display='none'"
                  >
                `
                : `
                  <div class="map-img-placeholder">🗺</div>
                `
            }

            <div class="map-body">

              <div class="map-checkbox">
                <svg
                  width="11"
                  height="11"
                  viewBox="0 0 12 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="2 6 5 9 10 3"></polyline>
                </svg>
              </div>

              <span class="map-name">
                ${m.name}
              </span>

            </div>

          </div>
        `,
          )
          .join("");

        document.getElementById("count").textContent = selected.size;
        document.getElementById("btn-sort").disabled = selected.size < 1;
      }

      function toggle(i) {
        if (selected.has(i)) {
          selected.delete(i);
        } else {
          selected.add(i);
        }

        document.getElementById("result-panel").classList.remove("show");

        document.getElementById("overlay").classList.remove("show");

        render();
      }

      function clearAll() {
        selected.clear();

        document.getElementById("result-panel").classList.remove("show");

        document.getElementById("overlay").classList.remove("show");

        render();
      }

      function sortear() {
        if (selected.size === 0) return;

        const pool = [...selected];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        const winner = pool[0];
        const selectedMap = {
          name: maps[winner].name,
          image: maps[winner].img,
        };

        const panel = document.getElementById("result-panel");

        const overlay = document.getElementById("overlay");

        const res = document.getElementById("result-maps");

        res.innerHTML = `
        <div class="result-map-card">

          <img
            src="${maps[winner].img}"
            alt="${maps[winner].name}"
            class="result-map-image"
          >

          <button type="button" class="result-map-badge winner" id="result-map-close" aria-label="Fechar resultado do mapa">
            ${maps[winner].name}
          </button>

        </div>
      `;

        document
          .getElementById("result-map-close")
          .addEventListener("click", closeResult);

        fetch("live_state.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            action: "finish_map_draw",
            maps: {
              status: "done",
              selected: [selectedMap],
            },
          }),
        }).catch(() => {});

        panel.classList.add("show");
        overlay.classList.add("show");
      }

      function closeResult() {
        document.getElementById("overlay").classList.remove("show");
        document.getElementById("result-panel").classList.remove("show");
      }

      document.getElementById("overlay").addEventListener("click", closeResult);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeResult();
      });

      render();
    </script>
  </body>
</html>
